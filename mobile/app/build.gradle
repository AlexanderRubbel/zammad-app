plugins {
    id 'com.android.application'
}

// Release signing is read from mobile/keystore.properties (NOT committed).
// Without it (e.g. fresh checkout), builds fall back to debug signing so
// `assembleDebug` still works; only the release AAB/APK needs the keystore.
def keystorePropsFile = rootProject.file("keystore.properties")
def hasKeystore = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.zammad.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.zammad.app"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "0.2.1"
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
